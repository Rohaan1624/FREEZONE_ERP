<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin esto env(safe-area-inset-bottom) vale 0 y, abierta
         desde la pantalla de inicio del iPhone, la barra de pestañas de abajo
         queda debajo de la raya de inicio. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ERP ZL · El ERP para la Zona Libre de Colón</title>
    <meta
      name="description"
      content="Inventario, costos de importación y facturación en un solo lugar. Para quien compra en Asia y reexporta a Latinoamérica desde la Zona Libre de Colón."
    />
    <link rel="canonical" href="https://freezone.cimatechpty.com/" />

    <!-- Se indexa: la raíz es la portada pública. Las pantallas de la app
         quedan fuera por public/robots.txt (y de todos modos piden sesión). -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignora los iconos SVG en la pantalla de inicio: sin un PNG pone una
         captura borrosa de la página. 180×180, cuadrado lleno y sin
         transparencia: iOS le aplica su propia máscara redondeada. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Nombre, colores e iconos al agregarla a la pantalla de inicio; con
         display standalone se abre como app, sin la barra del navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ERP ZL" />

    <!-- La app es de un solo tema (tinta sobre papel); decirlo evita que el
         navegador pinte controles en oscuro y desentonen. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f2f2" />

    <!-- La tarjeta que arman WhatsApp, correo o LinkedIn al pegar el enlace.
         URLs absolutas: con rutas relativas muchas apps no encuentran la
         imagen. Y PNG, no SVG: WhatsApp no muestra SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ERP ZL" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="ERP ZL · El ERP para la Zona Libre de Colón" />
    <meta property="og:url" content="https://freezone.cimatechpty.com/" />
    <meta
      property="og:description"
      content="Inventario, costos de importación y facturación en un solo lugar. Para quien compra en Asia y reexporta a Latinoamérica desde la Zona Libre de Colón."
    />
    <meta property="og:image" content="https://freezone.cimatechpty.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />

    <style>
      /* Pantalla de carga inline: sin esto se ve un flash blanco mientras
         descarga el bundle. React reemplaza el contenido de #root al montar,
         así que esto desaparece solo — no hace falta quitarlo por JS. */
      html { background: #f3f2f2; }
      body { margin: 0; }
      #cargando {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        align-content: center;
        background: #f3f2f2;
        color: #201e1d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #cargando .marca {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #201e1d;
        color: #f3f2f2;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      #cargando .barra {
        width: 132px;
        height: 4px;
        border-radius: 999px;
        background: #d7d3d3;
        overflow: hidden;
      }
      #cargando .barra span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #605d5d;
        animation: desliza 1.1s ease-in-out infinite;
      }
      @keyframes desliza {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      /* Respeta a quien pidió menos movimiento en su sistema. */
      @media (prefers-reduced-motion: reduce) {
        #cargando .barra span { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cargando">
        <div class="marca">ZL</div>
        <div class="barra"><span></span></div>
      </div>
    </div>

    <noscript>
      <div
        style="
          font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
          max-width: 42ch;
          margin: 15vh auto;
          padding: 0 24px;
          color: #201e1d;
          text-align: center;
        "
      >
        <h1 style="font-size: 21px; margin: 0 0 8px">Necesitas JavaScript</h1>
        <p style="font-size: 14px; margin: 0; color: #605d5d">
          Este sistema se ejecuta en el navegador. Actívalo para poder entrar.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
